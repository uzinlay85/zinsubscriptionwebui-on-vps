<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - {{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-950 text-white min-h-screen">
    <div class="flex">
        <aside class="w-64 bg-slate-900 border-r border-white/5 min-h-screen p-6">
            <div class="mb-8">
                <h1 class="text-xl font-bold text-white">{{ app_name }}</h1>
            </div>
            <nav class="space-y-2">
                <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Dashboard</span>
                </a>
                <a href="/servers" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Servers</span>
                </a>
                <a href="/clients" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Clients</span>
                </a>
                <a href="/settings" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white/5 text-white">
                    <span>Settings</span>
                </a>
            </nav>
        </aside>
        
        <main class="flex-1 p-8">
            <div class="max-w-2xl">
                <h1 class="text-3xl font-bold text-white mb-2">Settings</h1>
                <p class="text-zinc-400 mb-8">Configure your panel settings</p>

                <div id="error" class="hidden text-red-400 text-sm mb-4"></div>
                <div id="success" class="hidden text-emerald-400 text-sm mb-4"></div>

                <div class="glass-card p-6 space-y-6">
                    <div>
                        <h3 class="text-lg font-medium text-white mb-4">General Settings</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-zinc-400 mb-2">App Name</label>
                                <input type="text" id="app_name" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-zinc-400 mb-2">Panel Name</label>
                                <input type="text" id="panel_name" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-zinc-400 mb-2">Sync Interval (minutes)</label>
                                <input type="number" id="sync_interval" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                            </div>
                        </div>
                    </div>

                    <div class="border-t border-white/5 pt-6">
                        <h3 class="text-lg font-medium text-white mb-4">Backup & Restore</h3>
                        <div class="space-y-4">
                            <div class="flex gap-3">
                                <button onclick="exportBackup()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium transition-colors">
                                    Export Backup
                                </button>
                                <label class="px-4 py-2 bg-white/5 hover:bg-white/10 text-white rounded-xl font-medium transition-colors border border-white/10 cursor-pointer">
                                    Import Backup
                                    <input type="file" accept=".json" onchange="importBackup(event)" class="hidden">
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let settings = {};

        async function loadSettings() {
            try {
                const resp = await fetch('/api/settings/');
                if (resp.ok) {
                    const data = await resp.json();
                    settings = {};
                    data.forEach(s => {
                        settings[s.key] = s.value;
                    });
                    renderSettings();
                }
            } catch (err) {
                showError('Failed to load settings');
            }
        }

        function renderSettings() {
            document.getElementById('app_name').value = settings.APP_NAME || '';
            document.getElementById('panel_name').value = settings.PANEL_NAME || '';
            document.getElementById('sync_interval').value = settings.SYNC_INTERVAL_MINUTES || '10';
        }

        async function saveSettings() {
            const data = {
                settings: {
                    APP_NAME: document.getElementById('app_name').value,
                    PANEL_NAME: document.getElementById('panel_name').value,
                    SYNC_INTERVAL_MINUTES: document.getElementById('sync_interval').value
                }
            };

            try {
                const resp = await fetch('/api/settings/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                if (resp.ok) {
                    showSuccess('Settings saved successfully');
                    loadSettings();
                } else {
                    showError('Failed to save settings');
                }
            } catch (err) {
                showError('Failed to save settings');
            }
        }

        async function exportBackup() {
            try {
                const resp = await fetch('/api/backup/export');
                if (resp.ok) {
                    const blob = await resp.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `vpn-panel-backup-${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    window.URL.revokeObjectURL(url);
                    showSuccess('Backup exported successfully');
                } else {
                    showError('Failed to export backup');
                }
            } catch (err) {
                showError('Failed to export backup');
            }
        }

        async function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const resp = await fetch('/api/backup/import', {
                    method: 'POST',
                    body: formData
                });

                if (resp.ok) {
                    showSuccess('Backup imported successfully');
                    loadSettings();
                } else {
                    showError('Failed to import backup');
                }
            } catch (err) {
                showError('Failed to import backup');
            }
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('success');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        // Auto-save on change
        document.getElementById('app_name').addEventListener('change', saveSettings);
        document.getElementById('panel_name').addEventListener('change', saveSettings);
        document.getElementById('sync_interval').addEventListener('change', saveSettings);

        loadSettings();
    </script>
</body>
</html>
