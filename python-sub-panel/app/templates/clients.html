<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients - {{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-950 text-white min-h-screen">
    <!-- Mobile Top Header -->
    <header class="md:hidden flex items-center justify-between p-4 bg-slate-900 border-b border-white/5 sticky top-0 z-40">
        <h1 class="text-lg font-bold text-white tracking-wide">{{ app_name }}</h1>
        <button onclick="toggleMobileNav()" class="p-2 text-zinc-400 hover:text-white rounded-lg focus:outline-none bg-white/5 border border-white/10">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </header>

    <!-- Mobile Drawer Overlay -->
    <div id="mobileDrawer" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden md:hidden transition-opacity" onclick="toggleMobileNav()">
        <aside class="w-64 bg-slate-900 h-full p-6 space-y-6 border-r border-white/10" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold text-white">{{ app_name }}</h1>
                <button onclick="toggleMobileNav()" class="text-zinc-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <nav class="space-y-2">
                <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Dashboard</span>
                </a>
                <a href="/servers" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Servers</span>
                </a>
                <a href="/clients" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-600/20 text-blue-400 font-medium">
                    <span>Clients</span>
                </a>
                <a href="/settings" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Settings</span>
                </a>
            </nav>
        </aside>
    </div>

    <div class="flex flex-col md:flex-row">
        <!-- Desktop Sidebar -->
        <aside class="hidden md:block w-64 bg-slate-900 border-r border-white/5 min-h-screen p-6">
            <div class="mb-8">
                <h1 class="text-xl font-bold text-white">{{ app_name }}</h1>
            </div>
            <nav class="space-y-2">
                <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Dashboard</span>
                </a>
                <a href="/servers" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Servers</span>
                </a>
                <a href="/clients" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white/5 text-white">
                    <span>Clients</span>
                </a>
                <a href="/settings" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Settings</span>
                </a>
            </nav>
        </aside>
        
        <main class="flex-1 p-4 sm:p-6 md:p-8 max-w-full overflow-x-hidden">
            <div class="space-y-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-bold text-white">Clients</h1>
                        <p class="text-zinc-400 text-sm mt-1">Manage your VPN clients</p>
                    </div>
                    <button onclick="openModal()" class="w-full sm:w-auto px-5 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium transition-colors flex items-center justify-center gap-2">
                        <span>+ Add Client</span>
                    </button>
                </div>

                <div id="error" class="hidden text-red-400 text-sm"></div>
                <div id="success" class="hidden text-emerald-400 text-sm"></div>

                <div class="glass-card rounded-2xl border border-white/5 overflow-x-auto">
                    <table class="w-full text-left min-w-[640px]">
                        <thead>
                            <tr class="border-b border-white/5">
                                <th class="p-4 text-zinc-400 font-medium">Name</th>
                                <th class="p-4 text-zinc-400 font-medium">Status</th>
                                <th class="p-4 text-zinc-400 font-medium">Expiry</th>
                                <th class="p-4 text-zinc-400 font-medium">Usage</th>
                                <th class="text-right p-4 text-zinc-400 font-medium">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="clientsTable">
                            <tr>
                                <td colspan="5" class="p-8 text-center text-zinc-400">Loading clients...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Client Modal -->
    <div id="clientModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-white/10 rounded-2xl sm:rounded-3xl p-6 sm:p-8 max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl space-y-4">
            <div class="flex items-center justify-between mb-4">
                <h2 id="modalTitle" class="text-xl sm:text-2xl font-bold text-white">Add Client</h2>
                <button onclick="closeModal()" class="p-2 text-zinc-400 hover:text-white transition-colors rounded-lg bg-white/5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form id="clientForm" class="space-y-4">
                <input type="hidden" id="clientId">
                
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">Client Name</label>
                    <input type="text" id="name" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">Status</label>
                    <select id="status" class="w-full px-4 py-3 bg-slate-800 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                        <option value="active">Active</option>
                        <option value="disabled">Disabled</option>
                        <option value="expired">Expired</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">Expiry Date</label>
                    <input type="date" id="expiry_date" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">Data Limit (GB)</label>
                    <input type="number" id="data_limit_gb" step="0.1" placeholder="Leave empty for unlimited" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium transition-colors">
                        Save Client
                    </button>
                    <button type="button" onclick="closeModal()" class="px-4 py-3 bg-white/5 hover:bg-white/10 text-white rounded-xl font-medium transition-colors border border-white/10">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Keys Modal -->
    <div id="keysModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-white/10 rounded-2xl sm:rounded-3xl p-6 sm:p-8 max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl space-y-4">
            <div class="flex items-center justify-between mb-2">
                <div>
                    <h2 id="keysModalTitle" class="text-xl sm:text-2xl font-bold text-white">Generated Keys</h2>
                    <p class="text-zinc-400 text-xs sm:text-sm mt-1">Access keys for each configured server</p>
                </div>
                <button onclick="closeKeysModal()" class="p-2 text-zinc-400 hover:text-white transition-colors rounded-lg bg-white/5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <div id="keysContainer" class="space-y-4 overflow-y-auto pr-1 flex-1 max-h-[60vh]">
                <div class="text-center py-8 text-zinc-400">Loading keys...</div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t border-white/10">
                <button id="syncKeysBtn" onclick="" class="w-full sm:w-auto px-4 py-3 bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 rounded-xl font-medium transition-colors border border-blue-500/20 text-sm flex items-center justify-center gap-1.5">
                    🔄 Sync Missing Server Keys
                </button>
                <button type="button" onclick="closeKeysModal()" class="w-full sm:w-auto sm:ml-auto px-5 py-3 bg-white/5 hover:bg-white/10 text-white rounded-xl font-medium transition-colors border border-white/10 text-sm">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleMobileNav() {
            document.getElementById('mobileDrawer').classList.toggle('hidden');
        }

        let clients = [];

        async function loadClients() {
            try {
                const resp = await fetch('/api/clients/');
                if (resp.ok) {
                    clients = await resp.json();
                    renderClients();
                }
            } catch (err) {
                showError('Failed to load clients');
            }
        }

        function renderClients() {
            const tbody = document.getElementById('clientsTable');
            if (clients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-zinc-400">No clients configured. Add your first client to get started.</td></tr>';
                return;
            }

            tbody.innerHTML = clients.map(c => {
                const usageGB = (c.total_usage_bytes / 1024 / 1024 / 1024).toFixed(2);
                const limitGB = c.data_limit_gb ? c.data_limit_gb + ' GB' : 'Unlimited';
                const expiry = c.expiry_date ? new Date(c.expiry_date).toLocaleDateString() : 'Never';
                
                return `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                        <td class="p-4">
                            <div class="font-medium text-white">${escapeHtml(c.name)}</div>
                        </td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-full text-xs font-medium ${c.status === 'active' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}">${c.status}</span>
                        </td>
                        <td class="p-4 text-zinc-400 text-sm">${expiry}</td>
                        <td class="p-4 text-zinc-400 text-sm">${usageGB} GB / ${limitGB}</td>
                        <td class="p-4 text-right">
                            <button onclick="viewKeys('${c.id}')" class="px-3 py-1 bg-purple-500/10 text-purple-400 hover:bg-purple-500/20 rounded-lg text-xs font-medium mr-2 transition-colors border border-purple-500/20">🔑 View Keys</button>
                            <button onclick="copySubLink('${c.sub_token}')" class="px-3 py-1 bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 rounded-lg text-xs font-medium mr-2 transition-colors border border-blue-500/20">📋 Copy Sub</button>
                            <button onclick="editClient('${c.id}')" class="text-zinc-400 hover:text-white mr-2 text-sm">Edit</button>
                            <button onclick="deleteClient('${c.id}')" class="text-red-400 hover:text-red-300 text-sm">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openModal() {
            document.getElementById('clientForm').reset();
            document.getElementById('clientId').value = '';
            document.getElementById('modalTitle').textContent = 'Add Client';
            document.getElementById('clientModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('clientModal').classList.add('hidden');
        }

        async function editClient(id) {
            const client = clients.find(c => c.id === id);
            if (!client) return;

            document.getElementById('clientId').value = client.id;
            document.getElementById('name').value = client.name;
            document.getElementById('status').value = client.status;
            document.getElementById('expiry_date').value = client.expiry_date || '';
            document.getElementById('data_limit_gb').value = client.data_limit_gb || '';

            document.getElementById('modalTitle').textContent = 'Edit Client';
            document.getElementById('clientModal').classList.remove('hidden');
        }

        async function deleteClient(id) {
            if (!confirm('Are you sure you want to delete this client?')) return;
            
            try {
                const resp = await fetch(`/api/clients/${id}`, { method: 'DELETE' });
                if (resp.ok) {
                    showSuccess('Client deleted successfully');
                    loadClients();
                } else {
                    showError('Failed to delete client');
                }
            } catch (err) {
                showError('Failed to delete client');
            }
        }

        async function copySubLink(token) {
            const url = `${window.location.origin}/api/sub/${token}`;
            try {
                await navigator.clipboard.writeText(url);
                showSuccess('Subscription link copied to clipboard');
            } catch (err) {
                showError('Failed to copy link');
            }
        }

        document.getElementById('clientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('clientId').value;
            const data = {
                name: document.getElementById('name').value,
                status: document.getElementById('status').value,
                expiry_date: document.getElementById('expiry_date').value || null,
                data_limit_gb: document.getElementById('data_limit_gb').value ? parseInt(document.getElementById('data_limit_gb').value) : null
            };

            try {
                const url = id ? `/api/clients/${id}` : '/api/clients/';
                const method = id ? 'PUT' : 'POST';
                const resp = await fetch(url, {
                    method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                if (resp.ok) {
                    showSuccess(id ? 'Client updated successfully' : 'Client added successfully');
                    closeModal();
                    loadClients();
                } else {
                    const err = await resp.json();
                    showError(err.detail || 'Failed to save client');
                }
            } catch (err) {
                showError('Failed to save client');
            }
        });

        async function viewKeys(clientId) {
            const container = document.getElementById('keysContainer');
            container.innerHTML = '<div class="text-center py-8 text-zinc-400">Loading keys...</div>';
            document.getElementById('syncKeysBtn').onclick = () => syncClientKeys(clientId);
            document.getElementById('keysModal').classList.remove('hidden');

            try {
                const resp = await fetch(`/api/clients/${clientId}`);
                if (resp.ok) {
                    const client = await resp.json();
                    document.getElementById('keysModalTitle').textContent = `${client.name} - Generated Keys`;
                    
                    if (!client.keys || client.keys.length === 0) {
                        container.innerHTML = `
                            <div class="p-6 bg-white/5 border border-white/10 rounded-xl text-center">
                                <p class="text-zinc-400 mb-3">No keys found for this client.</p>
                                <button onclick="syncClientKeys('${clientId}')" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium transition-colors">
                                    Generate Keys for Active Servers
                                </button>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = client.keys.map(k => `
                        <div class="p-4 bg-white/5 border border-white/10 rounded-xl space-y-2">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="font-medium text-white">${escapeHtml(k.server_name || 'Server')}</span>
                                    <span class="px-2 py-0.5 rounded-full text-xs font-medium bg-purple-500/10 text-purple-400 border border-purple-500/20">${k.server_type || 'vpn'}</span>
                                </div>
                                <button onclick="copyKeyUrl('${escapeHtml(k.access_url || '')}')" class="px-3 py-1 bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 rounded-lg text-xs font-medium border border-emerald-500/20 transition-colors">
                                    📋 Copy Key
                                </button>
                            </div>
                            <div class="p-2.5 bg-black/40 rounded-lg font-mono text-xs text-zinc-300 break-all select-all border border-white/5">
                                ${escapeHtml(k.access_url || 'No access URL')}
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="text-center py-8 text-red-400">Failed to load client keys</div>';
                }
            } catch (err) {
                container.innerHTML = '<div class="text-center py-8 text-red-400">Error loading keys</div>';
            }
        }

        function closeKeysModal() {
            document.getElementById('keysModal').classList.add('hidden');
        }

        async function syncClientKeys(clientId) {
            try {
                showSuccess('Syncing server keys...');
                const resp = await fetch(`/api/clients/${clientId}/sync-keys`, { method: 'POST' });
                if (resp.ok) {
                    const data = await resp.json();
                    showSuccess(`Synced ${data.synced} missing server keys`);
                    viewKeys(clientId);
                } else {
                    showError('Failed to sync keys');
                }
            } catch (err) {
                showError('Failed to sync keys');
            }
        }

        async function copyKeyUrl(text) {
            if (!text) return;
            try {
                await navigator.clipboard.writeText(text);
                showSuccess('Access key copied to clipboard');
            } catch (err) {
                showError('Failed to copy key');
            }
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('success');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        loadClients();
    </script>
</body>
</html>
