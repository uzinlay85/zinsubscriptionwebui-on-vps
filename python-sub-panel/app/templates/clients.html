<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients - {{ app_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-slate-950 text-white min-h-screen">
    <div class="flex">
        <aside class="w-64 bg-slate-900 border-r border-white/5 min-h-screen p-6">
            <div class="mb-8">
                <h1 class="text-xl font-bold text-white">{{ app_name }}</h1>
            </div>
            <nav class="space-y-2">
                <a href="/" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Dashboard</span>
                </a>
                <a href="/servers" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Servers</span>
                </a>
                <a href="/clients" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white/5 text-white">
                    <span>Clients</span>
                </a>
                <a href="/settings" class="flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">
                    <span>Settings</span>
                </a>
            </nav>
        </aside>
        
        <main class="flex-1 p-8">
            <div class="space-y-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-3xl font-bold text-white">Clients</h1>
                        <p class="text-zinc-400 mt-1">Manage your VPN clients</p>
                    </div>
                    <button onclick="openModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium transition-colors">
                        Add Client
                    </button>
                </div>

                <div id="error" class="hidden text-red-400 text-sm"></div>
                <div id="success" class="hidden text-emerald-400 text-sm"></div>

                <div class="glass-card overflow-hidden">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-white/5">
                                <th class="text-left p-4 text-zinc-400 font-medium">Name</th>
                                <th class="text-left p-4 text-zinc-400 font-medium">Status</th>
                                <th class="text-left p-4 text-zinc-400 font-medium">Expiry</th>
                                <th class="text-left p-4 text-zinc-400 font-medium">Usage</th>
                                <th class="text-right p-4 text-zinc-400 font-medium">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="clientsTable">
                            <tr>
                                <td colspan="5" class="p-8 text-center text-zinc-400">Loading clients...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Client Modal -->
    <div id="clientModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-slate-900 border border-white/10 rounded-2xl p-8 max-w-lg w-full mx-4">
            <div class="flex items-center justify-between mb-6">
                <h2 id="modalTitle" class="text-2xl font-bold text-white">Add Client</h2>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            
            <form id="clientForm" class="space-y-4">
                <input type="hidden" id="clientId">
                
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">Client Name</label>
                    <input type="text" id="name" required class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">Status</label>
                    <select id="status" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                        <option value="active">Active</option>
                        <option value="suspended">Suspended</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">Expiry Date</label>
                    <input type="date" id="expiry_date" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-2">Data Limit (GB)</label>
                    <input type="number" id="data_limit_gb" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-medium transition-colors">
                        Save Client
                    </button>
                    <button type="button" onclick="closeModal()" class="px-4 py-3 bg-white/5 hover:bg-white/10 text-white rounded-xl font-medium transition-colors border border-white/10">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let clients = [];

        async function loadClients() {
            try {
                const resp = await fetch('/api/clients/');
                if (resp.ok) {
                    clients = await resp.json();
                    renderClients();
                }
            } catch (err) {
                showError('Failed to load clients');
            }
        }

        function renderClients() {
            const tbody = document.getElementById('clientsTable');
            if (clients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-zinc-400">No clients configured. Add your first client to get started.</td></tr>';
                return;
            }

            tbody.innerHTML = clients.map(c => {
                const usageGB = (c.total_usage_bytes / 1024 / 1024 / 1024).toFixed(2);
                const limitGB = c.data_limit_gb ? c.data_limit_gb + ' GB' : 'Unlimited';
                const expiry = c.expiry_date ? new Date(c.expiry_date).toLocaleDateString() : 'Never';
                
                return `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                        <td class="p-4">
                            <div class="font-medium text-white">${escapeHtml(c.name)}</div>
                        </td>
                        <td class="p-4">
                            <span class="px-2 py-1 rounded-full text-xs font-medium ${c.status === 'active' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}">${c.status}</span>
                        </td>
                        <td class="p-4 text-zinc-400 text-sm">${expiry}</td>
                        <td class="p-4 text-zinc-400 text-sm">${usageGB} GB / ${limitGB}</td>
                        <td class="p-4 text-right">
                            <button onclick="copySubLink('${c.sub_token}')" class="text-blue-400 hover:text-blue-300 mr-3">Copy Sub</button>
                            <button onclick="editClient('${c.id}')" class="text-blue-400 hover:text-blue-300 mr-3">Edit</button>
                            <button onclick="deleteClient('${c.id}')" class="text-red-400 hover:text-red-300">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openModal() {
            document.getElementById('clientForm').reset();
            document.getElementById('clientId').value = '';
            document.getElementById('modalTitle').textContent = 'Add Client';
            document.getElementById('clientModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('clientModal').classList.add('hidden');
        }

        async function editClient(id) {
            const client = clients.find(c => c.id === id);
            if (!client) return;

            document.getElementById('clientId').value = client.id;
            document.getElementById('name').value = client.name;
            document.getElementById('status').value = client.status;
            document.getElementById('expiry_date').value = client.expiry_date || '';
            document.getElementById('data_limit_gb').value = client.data_limit_gb || '';

            document.getElementById('modalTitle').textContent = 'Edit Client';
            document.getElementById('clientModal').classList.remove('hidden');
        }

        async function deleteClient(id) {
            if (!confirm('Are you sure you want to delete this client?')) return;
            
            try {
                const resp = await fetch(`/api/clients/${id}`, { method: 'DELETE' });
                if (resp.ok) {
                    showSuccess('Client deleted successfully');
                    loadClients();
                } else {
                    showError('Failed to delete client');
                }
            } catch (err) {
                showError('Failed to delete client');
            }
        }

        async function copySubLink(token) {
            const url = `${window.location.origin}/api/sub/${token}`;
            try {
                await navigator.clipboard.writeText(url);
                showSuccess('Subscription link copied to clipboard');
            } catch (err) {
                showError('Failed to copy link');
            }
        }

        document.getElementById('clientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('clientId').value;
            const data = {
                name: document.getElementById('name').value,
                status: document.getElementById('status').value,
                expiry_date: document.getElementById('expiry_date').value || null,
                data_limit_gb: document.getElementById('data_limit_gb').value ? parseInt(document.getElementById('data_limit_gb').value) : null
            };

            try {
                const url = id ? `/api/clients/${id}` : '/api/clients/';
                const method = id ? 'PUT' : 'POST';
                const resp = await fetch(url, {
                    method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                if (resp.ok) {
                    showSuccess(id ? 'Client updated successfully' : 'Client added successfully');
                    closeModal();
                    loadClients();
                } else {
                    const err = await resp.json();
                    showError(err.detail || 'Failed to save client');
                }
            } catch (err) {
                showError('Failed to save client');
            }
        });

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('success');
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        loadClients();
    </script>
</body>
</html>
